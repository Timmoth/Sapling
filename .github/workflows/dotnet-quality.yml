name: .NET quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore test projects
        run: |
          dotnet restore src/Sapling.Engine.Tests/Sapling.Engine.Tests.csproj
          dotnet restore src/Sapling.WebHost.Tests/Sapling.WebHost.Tests.csproj

      - name: Test engine and UCI with coverage
        run: >-
          dotnet test src/Sapling.Engine.Tests/Sapling.Engine.Tests.csproj
          --no-restore
          --configuration Release
          --collect:"XPlat Code Coverage"
          --settings .github/coverlet.runsettings
          --results-directory artifacts/TestResults/engine

      - name: Test web host with coverage
        run: >-
          dotnet test src/Sapling.WebHost.Tests/Sapling.WebHost.Tests.csproj
          --no-restore
          --configuration Release
          --collect:"XPlat Code Coverage"
          --settings .github/coverlet.runsettings
          --results-directory artifacts/TestResults/webhost

      - name: Upload Cobertura coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage
          path: artifacts/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
