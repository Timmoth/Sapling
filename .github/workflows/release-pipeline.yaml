name: Release Pipeline

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Sapling
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Get the version from the .csproj file
      - name: Get .NET application version
        working-directory: src/Sapling
        id: get_version
        run: |
          VERSION=$(dotnet msbuild Sapling.csproj -getProperty:Version)
          # Assembly-style 2.0.0.0 maps to the release tag Sapling-2.0.0.
          if [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\.0$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          fi
          echo "Application version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Build and Package AVX512 for all platforms
      - name: Build and Package AVX512 for Windows
        run: |
          dotnet restore
          dotnet publish -c Release -r win-x64 --self-contained /p:Release=true /p:PublishSingleFile=true -p:PublishTrimmed=false -p:ExecutableName=Sapling -p:SaplingBuildConstants=AVX512 -o ../output/win-x64-avx512

      - name: Build and Package Non-AVX512 for Windows
        run: |
          dotnet restore
          dotnet publish -c Release -r win-x64 --self-contained /p:Release=true /p:PublishSingleFile=true -p:PublishTrimmed=false -p:ExecutableName=Sapling -o ../output/win-x64

      - name: Build and Package AVX512 for Linux
        run: |
          dotnet restore
          dotnet publish -c Release -r linux-x64 --self-contained /p:Release=true /p:PublishSingleFile=true -p:PublishTrimmed=false -p:ExecutableName=Sapling -p:SaplingBuildConstants=AVX512 -o ../output/linux-x64-avx512

      - name: Build and Package Non-AVX512 for Linux
        run: |
          dotnet restore
          dotnet publish -c Release -r linux-x64 --self-contained /p:Release=true /p:PublishSingleFile=true -p:PublishTrimmed=false -p:ExecutableName=Sapling -o ../output/linux-x64

      - name: Build and Package AVX512 for OSX
        run: |
          dotnet restore
          dotnet publish -c Release -r osx-x64 --self-contained /p:Release=true /p:PublishSingleFile=true -p:PublishTrimmed=false -p:ExecutableName=Sapling -p:SaplingBuildConstants=AVX512 -o ../output/osx-x64-avx512

      - name: Build and Package Non-AVX512 for OSX
        run: |
          dotnet restore
          dotnet publish -c Release -r osx-x64 --self-contained /p:Release=true /p:PublishSingleFile=true -p:PublishTrimmed=false -p:ExecutableName=Sapling -o ../output/osx-x64

      - name: Build and Package for Apple Silicon
        run: >-
          dotnet publish -c Release -r osx-arm64 --self-contained
          /p:Release=true /p:PublishSingleFile=true -p:PublishTrimmed=false
          -p:ExecutableName=Sapling -o ../output/osx-arm64

      # Rename the output files for consistency
      - name: Rename output files
        run: |
          mv ../output/win-x64-avx512/Sapling.exe ../output/Sapling_win_x64_avx512.exe
          mv ../output/win-x64/Sapling.exe ../output/Sapling_win_x64.exe
          mv ../output/linux-x64-avx512/Sapling ../output/Sapling_linux_x64_avx512
          mv ../output/linux-x64/Sapling ../output/Sapling_linux_x64
          mv ../output/osx-x64-avx512/Sapling ../output/Sapling_osx_x64_avx512
          mv ../output/osx-x64/Sapling ../output/Sapling_osx_x64
          mv ../output/osx-arm64/Sapling ../output/Sapling_osx_arm64

      # List files in output directory to verify they exist
      - name: Verify output files
        run: |
          ls -R ../output

      # Generate release tag based on version
      - name: Generate release tag
        id: tag
        run: |
          echo "release_tag=Sapling-${{ steps.get_version.outputs.version }}" >> "$GITHUB_OUTPUT"

      # Create a single release with all artifacts
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: Sapling v${{ steps.get_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            ${{ github.workspace }}/src/output/Sapling_win_x64_avx512.exe
            ${{ github.workspace }}/src/output/Sapling_win_x64.exe
            ${{ github.workspace }}/src/output/Sapling_linux_x64_avx512
            ${{ github.workspace }}/src/output/Sapling_linux_x64
            ${{ github.workspace }}/src/output/Sapling_osx_x64_avx512
            ${{ github.workspace }}/src/output/Sapling_osx_x64
            ${{ github.workspace }}/src/output/Sapling_osx_arm64
